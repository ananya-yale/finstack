<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FinStack{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2313262F'/%3E%3Crect x='2.5' y='16.6' width='19' height='4.2' rx='1.3' fill='%2390A583'/%3E%3Crect x='5.5' y='11' width='13' height='4.2' rx='1.3' fill='%23C2A3A4'/%3E%3Cg transform='rotate(-9 12 6.2)'%3E%3Crect x='6.4' y='3.2' width='11.2' height='6' rx='1.2' fill='%23FAF7F5'/%3E%3Ccircle cx='12' cy='6.2' r='1.6' fill='%2313262F'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --navy:#13262F;      /* ink, dark surfaces */
    --sage:#90A583;      /* accent */
    --mauve:#7A6263;     /* primary accent */
    --mauve-deep:#5E4A4B;
    --paper:#FAF7F5;     /* warm page background */
    --card:#FFFFFF;
    --line:#E6DEDB;
    --muted:#6E6668;
    --sage-soft:#EDF1E9;
    --mauve-soft:#F4EBEA;
    --radius:4px;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--navy);
    font:16px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
  a{color:var(--mauve)}
  .wrap{max-width:880px;margin:0 auto;padding:34px 28px 90px}

  /* ---- masthead ---- */
  header.top{background:var(--navy);border-bottom:3px solid var(--mauve)}
  header.top .inner{max-width:880px;margin:0 auto;padding:15px 28px;
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .logo{display:inline-flex;align-items:center;gap:9px;text-decoration:none;
    font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--paper)}
  .logo .mark{width:25px;height:25px;flex:0 0 25px;transition:transform .15s ease}
  .logo:hover .mark{transform:translateY(-1px)}
  .logo:hover .wordmark span{color:#AFC2A3}
  .logo .wordmark span{color:var(--sage);transition:color .15s ease}
  .tag{color:#AFA6A6;font-size:14px}

  /* ---- hero: full-bleed, cropped not stretched ---- */
  .hero{position:relative;width:100%}
  .hero-img{position:relative;width:100%;height:clamp(300px,42vw,440px);overflow:hidden}
  .hero-img img{width:100%;height:100%;object-fit:cover;object-position:center 38%;
    display:block;filter:saturate(.72)}
  .hero-img::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,
      rgba(19,38,47,.94) 0%, rgba(19,38,47,.86) 34%,
      rgba(122,98,99,.74) 72%, rgba(122,98,99,.46) 100%)}
  .hero-overlay{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end}
  .hero-inner{max-width:880px;margin:0 auto;padding:0 28px 64px;width:100%;color:#fff}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    color:#D9C4C4;margin-bottom:12px;font-weight:700}
  .hero-inner h1{font-size:clamp(32px,4.6vw,50px);line-height:1.06;margin:0;
    font-weight:800;letter-spacing:-.025em;max-width:16ch;
    text-shadow:0 2px 20px rgba(0,0,0,.3)}
  .hero-inner h1 .accent{color:var(--sage)}
  .hero-card-wrap{max-width:880px;margin:0 auto;padding:0 28px;position:relative;z-index:3}
  .hero-card{margin-top:-40px;background:var(--mauve);border:1px solid var(--mauve);
    border-radius:var(--radius);padding:22px 28px;color:#fff;
    box-shadow:0 12px 36px rgba(19,38,47,.18)}
  .hero-card p{margin:0;font-size:17px;line-height:1.55;color:#fff}

  h1{font-size:32px;letter-spacing:-.025em;margin:0 0 10px;font-weight:800}
  h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    margin:44px 0 14px;color:var(--mauve);font-weight:800;
    padding-bottom:8px;border-bottom:2px solid var(--mauve-soft)}
  h2 .muted{letter-spacing:0;text-transform:none;font-weight:400;font-size:13px}
  .lede{color:var(--muted);margin:0 0 30px;max-width:60ch;font-size:17px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    border-top:3px solid var(--mauve);padding:22px 26px;margin-bottom:16px}
  .card-head{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;
    color:var(--mauve);margin:0 0 18px;padding-bottom:9px;
    border-bottom:2px solid var(--mauve-soft)}
  .card-head em{font-style:normal;color:var(--muted);font-weight:400;
    letter-spacing:0;text-transform:none;font-size:13px;margin-left:8px}

  label{display:block;font-weight:600;font-size:14px;margin-bottom:7px;color:var(--mauve-deep)}
  .hint{font-weight:400;color:var(--muted);font-size:13px}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
    font:inherit;font-size:15px;background:#fff;color:var(--navy)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--mauve);outline-offset:-1px}
  textarea{min-height:94px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .field{margin-bottom:20px}
  .checks{display:flex;flex-wrap:wrap;gap:9px}
  .checks label{display:inline-flex;align-items:center;gap:8px;font-weight:400;
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;
    background:#fff;font-size:14px;margin:0;color:var(--navy)}
  .checks label:hover{border-color:var(--mauve);background:var(--mauve-soft)}
  .checks label:has(input:checked){background:var(--mauve-soft);border-color:var(--mauve);
    color:var(--mauve-deep);font-weight:600}
  .checks input{margin:0;accent-color:var(--mauve)}

  button{background:var(--mauve);color:#fff;border:0;border-radius:var(--radius);
    padding:14px 32px;font-family:var(--ui);font-size:16px;font-weight:700;cursor:pointer;
    letter-spacing:.01em;box-shadow:0 2px 10px rgba(122,98,99,.28)}
  button:hover{background:var(--mauve-deep)}

  .examples{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 32px}
  .examples-label{font-size:14px;color:var(--muted)}
  button.ex{background:#fff;color:var(--mauve);border:1px solid var(--mauve);
    padding:7px 15px;font-size:14px;font-weight:600;border-radius:999px;box-shadow:none}
  button.ex:hover{background:var(--mauve);color:#fff}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;
    border-radius:999px;background:var(--sage-soft);color:#4a5c40;letter-spacing:.05em;
    text-transform:uppercase}
  .pill.warn{background:var(--mauve-soft);color:var(--mauve-deep)}
  .pill.bad{background:#F2E0DE;color:#7d3328}
  .pill.grey{background:#EFEAE8;color:var(--muted)}
  .costgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px;
    padding-top:16px;border-top:2px solid var(--mauve-soft)}
  .costnum{display:block;font-size:22px;font-weight:800;color:var(--mauve);
    letter-spacing:-.02em}
  .costlab{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
  .costlab em{font-style:normal;opacity:.8}
  @media (max-width:640px){.costgrid{grid-template-columns:repeat(2,1fr)}}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  ul.tight{margin:9px 0 0;padding-left:20px}
  ul.tight li{margin:4px 0}
  footer.meta{margin-top:46px;padding-top:20px;border-top:2px solid var(--mauve-soft);
    color:var(--muted);font-size:13px}
  table.usage{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
  table.usage th,table.usage td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)}
  table.usage th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mauve)}
  table.usage th:first-child,table.usage td:first-child{text-align:left}
  .step-num{flex:0 0 30px;height:30px;border-radius:999px;background:var(--mauve);
    color:#fff;font-weight:700;display:flex;align-items:center;
    justify-content:center;font-size:15px}
  .score{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--mauve)}
  .score.s-high{color:#2F9E44}   /* 70-100  strong fit */
  .score.s-mid{color:#BE9113}    /* 50-69   worth a look */
  .score.s-low{color:#BC6B2C}    /* 35-49   weak */
  .score.s-poor{color:#8C3A3A}   /* 0-34    unlikely */
  .mauve-card{background:var(--mauve);color:#fff;border-radius:var(--radius);
    padding:22px 28px;margin:0 0 30px;box-shadow:0 10px 30px rgba(122,98,99,.22)}
  .mauve-card p{margin:0;font-size:17px;line-height:1.55;color:#fff}
  details summary{cursor:pointer}
  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .hero-inner{padding-bottom:52px}
  }
</style>
</head>
<body>
<header class="top"><div class="inner">
  <a class="logo" href="/" aria-label="FinStack home">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <!-- a capital stack: non-dilutive base, then equity layers on top -->
      <rect x="1.5" y="17" width="21" height="4.4" rx="1.4" fill="#90A583"/>
      <rect x="5" y="11.1" width="14" height="4.4" rx="1.4" fill="#C2A3A4"/>
      <g transform="rotate(-9 12 6)">
        <rect x="6.3" y="2.9" width="11.4" height="6.2" rx="1.2" fill="#FAF7F5"/>
        <circle cx="12" cy="6" r="1.65" fill="#13262F"/>
      </g>
    </svg>
    <span class="wordmark">Fin<span>Stack</span></span>
  </a>
  <div class="tag">Funding routes for US fintech founders</div>
</div></header>
{% block hero %}{% endblock %}
<div class="wrap">
{% block body %}{% endblock %}
</div>
</body>
</html>
